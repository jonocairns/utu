name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1 and luacheck
        run: sudo apt-get update && sudo apt-get install -y lua5.1 lua-check
      - name: Lint
        run: luacheck Utu
      - name: Run tests
        run: lua5.1 tests/run.lua

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches toc version
        run: |
          toc=$(sed -n 's/^## Version: *//p' Utu/Utu.toc | tr -d '\r')
          [ "v$toc" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME doesn't match toc version $toc"; exit 1; }
      - name: Build
        run: ./build.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        # Notes come from the top of CHANGELOG.md (build.sh writes dist/notes.md).
        # If the release was already made by hand, refresh its files instead.
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/release.json --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip dist/release.json --title "Utu $GITHUB_REF_NAME" --notes-file dist/notes.md
          fi
